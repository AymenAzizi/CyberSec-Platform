# =============================================================================
# nginx.conf — PFE Cybersec Platform reverse proxy
# Final CDC: security headers, rate limiting, gzip, TLS-ready
# =============================================================================
# Loaded at /etc/nginx/nginx.conf inside the nginx container (read-only mount).
# Per-server blocks live in /etc/nginx/conf.d/*.conf (also mounted ro).
# =============================================================================

user  nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

# Write to stderr so docker logs captures it
error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

http {
    # ---------------------------------------------------------------------------
    # Basic
    # ---------------------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    log_not_found off;

    charset utf-8;
    charset_types text/css text/plain text/xml application/json application/javascript;

    # ---------------------------------------------------------------------------
    # Logging
    # ---------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_iso8601] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'urt=$upstream_response_time uht=$upstream_header_time';

    access_log /dev/stdout main;

    # ---------------------------------------------------------------------------
    # Performance
    # ---------------------------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  30s;
    keepalive_requests 100;
    client_max_body_size 32m;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    server_names_hash_bucket_size 64;
    types_hash_max_size 2048;

    # ---------------------------------------------------------------------------
    # Gzip
    # ---------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/atom+xml
        application/x-json
        application/manifest+json
        application/x-web-app-manifest+json
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2
        application/wasm
        application/vnd.api+json;

    # ---------------------------------------------------------------------------
    # Rate limiting zones
    # ---------------------------------------------------------------------------
    # login : 300 requests / minute / IP
    limit_req_zone $binary_remote_addr zone=login:10m rate=300r/m;
    # scan  : 300 requests / minute / IP
    limit_req_zone $binary_remote_addr zone=scan:10m  rate=300r/m;
    # api   : 300 requests / minute / IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=300r/m;
    # global fallback: 500 requests / minute / IP
    limit_req_zone $binary_remote_addr zone=global:10m rate=500r/m;
    # Connection limit (concurrent)
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    limit_req_status 429;
    limit_conn_status 429;

    # ---------------------------------------------------------------------------
    # Upstreams
    # ---------------------------------------------------------------------------
    upstream backend {
        server backend:9000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    upstream api_gateway {
        server api-gateway:8080 max_fails=3 fail_timeout=15s;
        keepalive 16;
    }

    # ---------------------------------------------------------------------------
    # SSL defaults (used when TLS is enabled via Let's Encrypt volume)
    # ---------------------------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;
    ssl_ecdh_curve X25519:secp384r1:prime256v1;

    # OCSP stapling (requires trusted CA cert at /etc/letsencrypt/live/.../chain.pem)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 1.0.0.1 valid=300s ipv6=off;
    resolver_timeout 5s;

    # ---------------------------------------------------------------------------
    # Map for real client IP (when behind additional CDN/proxy)
    # ---------------------------------------------------------------------------
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    # ---------------------------------------------------------------------------
    # Security headers — applied globally via include in server blocks
    # ---------------------------------------------------------------------------
    # HSTS: 1 year, include subdomains, preload (only enable over HTTPS)
    # CSP: strict default-src, allow inline only where Laravel/Vite needs it
    map $sent_http_content_type $csp_header {
        default "default-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';";
        ~*^text/html "default-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self';";
    }

    # ---------------------------------------------------------------------------
    # Include per-server config files (mounted ro at /etc/nginx/conf.d/)
    # ---------------------------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}
