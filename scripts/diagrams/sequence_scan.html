<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sequence - Scan Launch Flow</title>
<style>
  @page { size: 1820px 1280px; margin: 0; }
  html, body { margin: 0; padding: 0; background: #ffffff; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1f2937; }
  .canvas { position: relative; width: 1820px; height: 1280px; background: #ffffff; }
  .title { position:absolute; top:16px; left:0; width:100%; text-align:center; font-size:22px; font-weight:700; color:#111827; }
  .subtitle { position:absolute; top:46px; left:0; width:100%; text-align:center; font-size:12.5px; color:#6b7280; }
  svg.seq { position:absolute; top:0; left:0; width:1820px; height:1280px; }
  .lbl { font-size: 12px; fill: #1f2937; }
  .lbl-sm { font-size: 11px; fill: #4b5563; }
  .frag-lbl { font-size: 12px; fill: #92400e; font-weight: 700; }
  .frag-lbl-red { font-size: 12px; fill: #991b1b; font-weight: 700; }
  .part-name { font-size: 13px; font-weight: 700; fill: #ffffff; }
  .part-sub { font-size: 10.5px; fill: #f3f4f6; }
</style>
</head>
<body>
<div class="canvas">
  <div class="title">Figure 4.1 — Diagramme de séquence : lancement d'un scan (flow événementiel)</div>
  <div class="subtitle">Redis Streams (XREADGROUP, consumer group) — retries ×3, dégradation gracieuse, broadcast temps réel</div>

  <svg class="seq" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
        <path d="M 0,0 L 10,5 L 0,10 z" fill="#374151"/>
      </marker>
      <marker id="arrRet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
        <path d="M 0,0 L 10,5 L 0,10" fill="none" stroke="#6b7280" stroke-width="1.4"/>
      </marker>
      <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
        <path d="M 0,0 L 10,5 L 0,10 z" fill="#EF4444"/>
      </marker>
      <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
        <path d="M 0,0 L 10,5 L 0,10 z" fill="#F59E0B"/>
      </marker>
    </defs>

    <!-- Participant x centers -->
    <!-- User:130  Laravel:330  Redis:530  Worker:730  Recon:930  nmap:1130  Parser:1330  Graph:1530  AI:1730 -->

    <!-- Participant header boxes -->
    <rect x="60"  y="70" width="140" height="48" rx="4" fill="#3B82F6" stroke="#1d4ed8"/>
    <text x="130" y="92"  text-anchor="middle" class="part-name">User</text>
    <text x="130" y="108" text-anchor="middle" class="part-sub">(analyst, browser)</text>

    <rect x="260" y="70" width="140" height="48" rx="4" fill="#10B981" stroke="#047857"/>
    <text x="330" y="92"  text-anchor="middle" class="part-name">Laravel Backend</text>
    <text x="330" y="108" text-anchor="middle" class="part-sub">PHP 8.3 / Echo</text>

    <rect x="460" y="70" width="140" height="48" rx="4" fill="#8B5CF6" stroke="#6d28d9"/>
    <text x="530" y="92"  text-anchor="middle" class="part-name">Redis Streams</text>
    <text x="530" y="108" text-anchor="middle" class="part-sub">scan:requests</text>

    <rect x="660" y="70" width="140" height="48" rx="4" fill="#F59E0B" stroke="#b45309"/>
    <text x="730" y="92"  text-anchor="middle" class="part-name">Worker</text>
    <text x="730" y="108" text-anchor="middle" class="part-sub">Redis consumer</text>

    <rect x="860" y="70" width="140" height="48" rx="4" fill="#10B981" stroke="#047857"/>
    <text x="930" y="92"  text-anchor="middle" class="part-name">Recon MS</text>
    <text x="930" y="108" text-anchor="middle" class="part-sub">Flask :5000</text>

    <rect x="1060" y="70" width="140" height="48" rx="4" fill="#EF4444" stroke="#b91c1c"/>
    <text x="1130" y="92"  text-anchor="middle" class="part-name">nmap (Tool)</text>
    <text x="1130" y="108" text-anchor="middle" class="part-sub">subprocess</text>

    <rect x="1260" y="70" width="140" height="48" rx="4" fill="#10B981" stroke="#047857"/>
    <text x="1330" y="92"  text-anchor="middle" class="part-name">ResultParser</text>
    <text x="1330" y="108" text-anchor="middle" class="part-sub">normalizer</text>

    <rect x="1460" y="70" width="140" height="48" rx="4" fill="#10B981" stroke="#047857"/>
    <text x="1530" y="92"  text-anchor="middle" class="part-name">GraphBuilder</text>
    <text x="1530" y="108" text-anchor="middle" class="part-sub">NetworkX + AGE</text>

    <rect x="1660" y="70" width="140" height="48" rx="4" fill="#10B981" stroke="#047857"/>
    <text x="1730" y="92"  text-anchor="middle" class="part-name">AI Service</text>
    <text x="1730" y="108" text-anchor="middle" class="part-sub">Ollama :11434</text>

    <!-- Lifelines (dashed) -->
    <line x1="130"  y1="118" x2="130"  y2="1230" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="330"  y1="118" x2="330"  y2="1230" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="530"  y1="118" x2="530"  y2="1230" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="730"  y1="118" x2="730"  y2="1230" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="930"  y1="118" x2="930"  y2="1230" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="1130" y1="118" x2="1130" y2="1230" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="1330" y1="118" x2="1330" y2="1230" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="1530" y1="118" x2="1530" y2="1230" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="1730" y1="118" x2="1730" y2="1230" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- Activation bars -->
    <rect x="324" y="160" width="12" height="100" fill="#10B981" opacity="0.35"/>           <!-- Laravel req -->
    <rect x="524" y="240" width="12" height="44" fill="#8B5CF6" opacity="0.35"/>             <!-- Redis -->
    <rect x="724" y="280" width="12" height="540" fill="#F59E0B" opacity="0.35"/>            <!-- Worker long -->
    <rect x="924" y="350" width="12" height="440" fill="#10B981" opacity="0.35"/>            <!-- Recon -->
    <rect x="1124" y="390" width="12" height="44" fill="#EF4444" opacity="0.35"/>            <!-- nmap -->
    <rect x="1324" y="470" width="12" height="44" fill="#10B981" opacity="0.35"/>            <!-- Parser -->
    <rect x="1524" y="550" width="12" height="84" fill="#10B981" opacity="0.35"/>            <!-- Graph -->
    <rect x="1724" y="670" width="12" height="84" fill="#10B981" opacity="0.35"/>            <!-- AI -->
    <rect x="324" y="860" width="12" height="84" fill="#10B981" opacity="0.35"/>             <!-- Laravel update -->

    <!-- Loop fragment (amber) -->
    <rect x="690" y="316" width="1060" height="520" rx="4" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="690" y="316" width="220" height="22" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="700" y="332" class="frag-lbl">loop [1..3 — retry on failure]</text>
    <text x="920" y="332" class="lbl-sm">exp. backoff = 2^n s</text>

    <!-- 1. User -> Laravel : POST /scans -->
    <line x1="136" y1="170" x2="324" y2="170" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="230" y="164" text-anchor="middle" class="lbl">1. POST /scans (target_id, profile)</text>

    <!-- 2. Laravel self : validate + create Scan(pending) -->
    <path d="M 336,200 L 376,200 L 376,216 L 340,216" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="382" y="212" class="lbl">2. validate + create Scan(state=pending)</text>

    <!-- 3. Laravel -> Redis : XADD -->
    <line x1="336" y1="250" x2="524" y2="250" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="430" y="244" text-anchor="middle" class="lbl">3. XADD scan:requests * (scan_id, profile)</text>

    <!-- 4. Redis -> Worker : XREADGROUP -->
    <line x1="536" y1="290" x2="724" y2="290" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="630" y="284" text-anchor="middle" class="lbl">4. XREADGROUP g=scan-workers &gt; worker-1</text>

    <!-- 5. Worker -> Recon : POST /scan -->
    <line x1="736" y1="360" x2="924" y2="360" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrAmber)"/>
    <text x="830" y="354" text-anchor="middle" class="lbl" fill="#92400e">5. POST /scan {profile, target}</text>

    <!-- 6. Recon -> nmap : subprocess -->
    <line x1="936" y1="400" x2="1124" y2="400" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrAmber)"/>
    <text x="1030" y="394" text-anchor="middle" class="lbl" fill="#92400e">6. nmap -T2/-T3/-T4 --max-rate ...</text>

    <!-- 7. nmap -> Recon : raw output (return) -->
    <line x1="1124" y1="440" x2="936" y2="440" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#arrRet)"/>
    <text x="1030" y="434" text-anchor="middle" class="lbl-sm">7. raw XML/JSON output</text>

    <!-- 8. Recon -> Parser : normalize -->
    <line x1="936" y1="480" x2="1324" y2="480" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrAmber)"/>
    <text x="1130" y="474" text-anchor="middle" class="lbl" fill="#92400e">8. normalize(raw, citations)</text>

    <!-- 9. Parser -> Recon : Findings[] (return) -->
    <line x1="1324" y1="520" x2="936" y2="520" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#arrRet)"/>
    <text x="1130" y="514" text-anchor="middle" class="lbl-sm">9. Findings[] (CVSS, CVE, citations)</text>

    <!-- 10. Recon -> Graph : build -->
    <line x1="936" y1="560" x2="1524" y2="560" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrAmber)"/>
    <text x="1230" y="554" text-anchor="middle" class="lbl" fill="#92400e">10. build_graph(assets, findings)</text>

    <!-- 11. Graph self : BFS blast_radius -->
    <path d="M 1536,590 L 1576,590 L 1576,606 L 1540,606" fill="none" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrAmber)"/>
    <text x="1582" y="602" class="lbl" fill="#92400e">11. BFS blast_radius (NetworkX)</text>

    <!-- 12. Graph -> Recon : return -->
    <line x1="1524" y1="640" x2="936" y2="640" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#arrRet)"/>
    <text x="1230" y="634" text-anchor="middle" class="lbl-sm">12. graph + blast_radius (Apache AGE)</text>

    <!-- 13. Recon -> AI : get_remediation -->
    <line x1="936" y1="680" x2="1724" y2="680" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrAmber)"/>
    <text x="1330" y="674" text-anchor="middle" class="lbl" fill="#92400e">13. get_remediation(findings)</text>

    <!-- 14. AI self : Ollama chat -->
    <path d="M 1736,710 L 1776,710 L 1776,726 L 1740,726" fill="none" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrAmber)"/>
    <text x="1782" y="722" class="lbl" fill="#92400e">14. Ollama chat (qwen2.5-coder:7b)</text>

    <!-- 15. AI -> Recon : remediation + citations (return) -->
    <line x1="1724" y1="760" x2="936" y2="760" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#arrRet)"/>
    <text x="1330" y="754" text-anchor="middle" class="lbl-sm">15. Remediation-as-Code + citations</text>

    <!-- 16. Recon -> Worker : 200 OK (return) -->
    <line x1="924" y1="800" x2="736" y2="800" stroke="#6b7280" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#arrRet)"/>
    <text x="830" y="794" text-anchor="middle" class="lbl-sm">16. 200 OK + result bundle</text>

    <!-- 17. Worker -> Laravel : PATCH status=completed -->
    <line x1="724" y1="870" x2="336" y2="870" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="530" y="864" text-anchor="middle" class="lbl">17. PATCH /api/scans/{id}/status=completed</text>

    <!-- 18. Laravel self : update DB + broadcast -->
    <path d="M 336,900 L 376,900 L 376,916 L 340,916" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="382" y="912" class="lbl">18. update DB + broadcast(ScanCompleted)</text>

    <!-- 19. Laravel -> User : Echo push -->
    <line x1="324" y1="940" x2="136" y2="940" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="230" y="934" text-anchor="middle" class="lbl">19. Laravel Echo push (WebSocket)</text>

    <!-- Worker XACK on success -->
    <line x1="736" y1="820" x2="536" y2="820" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="636" y="814" text-anchor="middle" class="lbl-sm">XACK scan:requests (commit)</text>

    <!-- Alt fragment (failure, red) -->
    <rect x="60" y="990" width="1740" height="230" rx="4" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="60" y="990" width="320" height="22" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="70" y="1006" class="frag-lbl-red">alt [failure after 3 retries — graceful degradation]</text>

    <!-- F1. Worker -> Laravel : PATCH status=failed -->
    <line x1="724" y1="1040" x2="336" y2="1040" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrRed)"/>
    <text x="530" y="1034" text-anchor="middle" class="lbl" fill="#991b1b">F1. PATCH /api/scans/{id}/status=failed (reason)</text>

    <!-- F2. Laravel self : log + alert -->
    <path d="M 336,1070 L 376,1070 L 376,1086 L 340,1086" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrRed)"/>
    <text x="382" y="1082" class="lbl" fill="#991b1b">F2. security_alerts.insert + audit_logs.append</text>

    <!-- F3. Laravel -> User : notify failure -->
    <line x1="324" y1="1110" x2="136" y2="1110" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrRed)"/>
    <text x="230" y="1104" text-anchor="middle" class="lbl" fill="#991b1b">F3. notify user (Echo + email)</text>

    <!-- F4. Worker self : XADD to DLQ -->
    <path d="M 736,1140 L 776,1140 L 776,1156 L 740,1156" fill="none" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrRed)"/>
    <text x="782" y="1152" class="lbl" fill="#991b1b">F4. XADD scan:dead-letter + XACK (drop)</text>

    <!-- F5. Recon fallback if AI unreachable -->
    <line x1="1724" y1="1180" x2="936" y2="1180" stroke="#F59E0B" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrAmber)"/>
    <text x="1330" y="1174" text-anchor="middle" class="lbl-sm" fill="#92400e">F5. fallback: empty remediation, scan still completes (degraded)</text>

  </svg>
</div>
</body>
</html>
