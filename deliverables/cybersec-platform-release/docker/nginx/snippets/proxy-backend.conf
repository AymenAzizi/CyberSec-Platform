# =============================================================================
# Snippet: hand off to Laravel via PHP-FPM (fastcgi)
# =============================================================================
# Note: PHP-FPM is NOT an HTTP upstream — we use fastcgi_pass, not proxy_pass.
# The Laravel front controller (public/index.php) handles routing.
# =============================================================================
# Set sane FastCGI timeouts + buffers
fastcgi_connect_timeout 5s;
fastcgi_send_timeout    60s;
fastcgi_read_timeout    60s;

fastcgi_buffering    on;
fastcgi_buffer_size  16k;
fastcgi_buffers      8 16k;
fastcgi_busy_buffers_size 32k;

# Pass standard FastCGI vars
include               fastcgi_params;
fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
fastcgi_param  PATH_INFO       $fastcgi_path_info;

# Tell Laravel it's behind a trusted proxy
fastcgi_param  HTTP_X_FORWARDED_PROTO $scheme;
fastcgi_param  HTTP_X_FORWARDED_HOST   $host;
fastcgi_param  HTTP_X_REAL_IP          $remote_addr;

# Hand off to the upstream named "backend"
fastcgi_pass   backend;

# Try static file first, fall back to Laravel's front controller
try_files $uri $uri/ /index.php?$query_string;
