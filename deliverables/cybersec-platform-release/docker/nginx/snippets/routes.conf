# Snippet: shared route definitions (included from http & https servers)
include /etc/nginx/snippets/security-headers.conf;

location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
}

# ACME
location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type "text/plain";
    try_files $uri =404;
}

# Rate-limited routes
location = /login {
    limit_req zone=login burst=5 nodelay;
    limit_conn conn_per_ip 5;
    include /etc/nginx/snippets/proxy-backend.conf;
}

location ^~ /api/scan {
    limit_req zone=scan burst=2 nodelay;
    limit_conn conn_per_ip 3;
    include /etc/nginx/snippets/proxy-api-gateway.conf;
}

location /api/ {
    limit_req zone=api burst=20 nodelay;
    limit_conn conn_per_ip 20;
    include /etc/nginx/snippets/proxy-api-gateway.conf;
}

location ~* \.(?:css|js|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|ico|webp|avif|map)$ {
    expires 7d;
    access_log off;
    add_header Cache-Control "public, immutable, max-age=604800" always;
    try_files $uri =404;
}

location /storage/ {
    alias /var/www/html/storage/app/public/;
    expires 1h;
    access_log off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=3600" always;
    location ~ \.php$ { return 404; }
}

location ~ /\.(?!well-known).* { return 404; }
location ~* /(?:composer\.(json|lock)|package(-lock)?\.json|artisan|phpunit\.xml|\.env)$ { return 404; }
location ~* /vendor/ { return 404; }

location / {
    include /etc/nginx/snippets/proxy-backend.conf;
}

client_max_body_size 32m;
