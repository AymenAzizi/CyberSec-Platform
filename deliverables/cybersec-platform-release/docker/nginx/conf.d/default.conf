# =============================================================================
# Default server — catches all unknown hosts, returns 444 (no response)
# =============================================================================
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;
    return      444;
}

# =============================================================================
# HTTP → HTTPS redirect + ACME challenge passthrough
# Disable the redirect block in dev (no TLS) by symlinking only this file.
# =============================================================================
server {
    listen      80;
    listen      [::]:80;
    server_name ${CYBERSEC_DOMAIN:-localhost};

    # ACME http-01 challenge (Let's Encrypt)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Health probe for docker / load balancer
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # In dev (no cert), serve over HTTP directly. In prod enable redirect:
    # return 301 https://$host$request_uri;

    root /var/www/html/public;

    # Security headers (applied to all responses)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header X-XSS-Protection "0" always;
    add_header Content-Security-Policy $csp_header always;
    # HSTS — only set on HTTPS, never on plain HTTP
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ---------------------------------------------------------------------------
    # Rate-limited routes
    # ---------------------------------------------------------------------------
    location = /login {
        limit_req zone=login burst=5 nodelay;
        limit_conn conn_per_ip 5;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    location ^~ /api/scan {
        limit_req zone=scan burst=2 nodelay;
        limit_conn conn_per_ip 3;
        include /etc/nginx/snippets/proxy-api-gateway.conf;
    }

    # ---------------------------------------------------------------------------
    # API — route to api-gateway service
    # ---------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_conn conn_per_ip 20;
        include /etc/nginx/snippets/proxy-api-gateway.conf;
    }

    # ---------------------------------------------------------------------------
    # Static Laravel assets (Vite build output)
    # ---------------------------------------------------------------------------
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|png|jpe?g|gif|svg|ico|webp|avif|map)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, immutable, max-age=604800" always;
        try_files $uri =404;
    }

    # ---------------------------------------------------------------------------
    # Storage (public disk) — served directly, never execute PHP here
    # ---------------------------------------------------------------------------
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 1h;
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600" always;
        location ~ \.php$ { return 404; }
    }

    # ---------------------------------------------------------------------------
    # Block dotfiles & sensitive paths
    # ---------------------------------------------------------------------------
    location ~ /\.(?!well-known).* { return 404; }
    location ~* /(?:composer\.(json|lock)|package(-lock)?\.json|artisan|phpunit\.xml|\.env)$ { return 404; }
    location ~* /vendor/ { return 404; }

    # ---------------------------------------------------------------------------
    # Default — proxy to backend PHP-FPM
    # ---------------------------------------------------------------------------
    location / {
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    client_max_body_size 32m;
}
